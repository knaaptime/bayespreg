[build-system]
requires = ["setuptools>=77.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "neighbayes"
dynamic = ["version"]
description = "Bayesian spatial econometric regression models in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "eli knaap" }]
keywords = [
    "bayesian",
    "spatial econometrics",
    "spatial statistics",
    "regression",
    "mcmc",
    "gibbs sampling",
    "pymc",
    "spatial analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

dependencies = [
    "pymc>=5.16",
    "pytensor>=2.25",
    "arviz>=0.18,<1",
    "libpysal>=4.9",
    "formulaic>=1.0",
    "lazy_loader>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "polyagamma>=2.0",
    "scikit-sparse>=0.5",
]

[project.urls]
Homepage = "https://github.com/knaaptime/neighbayes"
Repository = "https://github.com/knaaptime/neighbayes"
Issues = "https://github.com/knaaptime/neighbayes/issues"

[project.optional-dependencies]
viz = ["graphviz"]
backend = ['dm-tree', 'blackjax', 'numpyro', 'nutpie', 'equinox', 'sparsax', 'pgjax']
cv = ["spml"]

[tool.setuptools.packages.find]
include = ["neighbayes", "neighbayes.*"]

[tool.setuptools.package-data]
neighbayes = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["neighbayes/tests"]
addopts = "-m 'not slow'"   # run fast tests by default; use -m slow or -m '' to include all
markers = [
    "slow: marks tests as slow (MCMC parameter recovery — deselected by default)",
    "recovery: marks parameter recovery tests (fit model, assert posterior ≈ true params)",
    "requires_jax: marks tests that activate a JAX backend (gibbs_backend='jax', numpyro/blackjax NUTS) — auto-skipped on Windows",
]

[tool.coverage.run]
source = ["neighbayes"]
omit = [
    "neighbayes/tests/*",
    "*/tests/*",
]

[tool.coverage.report]
omit = [
    "neighbayes/tests/*",
    "*/tests/*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "docs/build",
    "reference",
    "neighbayes.egg-info",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",  # line too long — handled by formatter; remaining are long string literals
    "E741",  # ambiguous variable name — math notation (l, I, O) is intentional
    "E402",  # module-level import not at top — used for conditional/optional imports
]
extend-select = ["I"]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"__init__.pyi" = ["F401", "F403"]
"neighbayes/tests/*" = ["F401", "F811", "F841"]

[tool.ruff.format]
docstring-code-format = false

